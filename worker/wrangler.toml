name = "saas-manicure-booking-api"
main = "src/index.ts"
compatibility_date = "2026-10-01"

[vars]
# Local default only: replace with an exact HTTPS frontend origin in staging/production.
# The Worker rejects HTTP origin outside the loopback Firebase Emulator.
ALLOWED_ORIGIN = "http://127.0.0.1:5173"

# Secrets obrigatórios no deploy (NÃO versionar valores):
# FIREBASE_PROJECT_ID
# FIREBASE_CLIENT_EMAIL
# FIREBASE_PRIVATE_KEY

# Storage inventory requires FIREBASE_STORAGE_BUCKET configured for the correct Firebase project.
# Production service account needs only its audited datastore and object-specific Storage permissions.
# MEDIA_DELETION_ENABLED is intentionally omitted (defaults OFF).
# Never enable physical deletion without staging QA, independent approval and backups.
