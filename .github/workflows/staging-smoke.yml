name: Staging read-only smoke
on:
  workflow_dispatch:
    inputs:
      web_origin:
        description: "HTTPS origin of the isolated staging frontend (no path)"
        required: true
        type: string
      api_origin:
        description: "HTTPS origin of the isolated staging Worker (no path)"
        required: true
        type: string
      sample_tenant_id:
        description: "Optional synthetic staging tenant ID for Firestore index probe"
        required: false
        type: string
      sample_service_id:
        description: "Optional active service ID from synthetic staging tenant"
        required: false
        type: string
      sample_professional_id:
        description: "Optional active professional ID in synthetic staging tenant"
        required: false
        type: string
      sample_date:
        description: "Optional YYYY-MM-DD with at least one free synthetic studio slot"
        required: false
        type: string

jobs:
  read-only-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node --test scripts/staging-smoke.test.mjs
      - name: Probe staging without credentials or writes
        run: node scripts/staging-smoke.mjs
        env:
          STAGING_WEB_ORIGIN: ${{ inputs.web_origin }}
          STAGING_API_ORIGIN: ${{ inputs.api_origin }}
          STAGING_SAMPLE_TENANT_ID: ${{ inputs.sample_tenant_id }}
          STAGING_SAMPLE_SERVICE_ID: ${{ inputs.sample_service_id }}
          STAGING_SAMPLE_PROFESSIONAL_ID: ${{ inputs.sample_professional_id }}
          STAGING_SAMPLE_DATE: ${{ inputs.sample_date }}
